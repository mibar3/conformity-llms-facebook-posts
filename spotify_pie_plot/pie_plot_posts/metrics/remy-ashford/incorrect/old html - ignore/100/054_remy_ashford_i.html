<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .post-container {
            width: 100%;
            max-width: 680px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* ── Header ── */
        .post-header {
            display: flex;
            padding: 12px 16px;
            align-items: center;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: #e4e6eb;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-info { flex: 1; }

        .name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .profile-name {
            font-weight: 600;
            font-size: 15px;
            color: #050505;
            text-decoration: none;
        }

        .profile-name:hover { text-decoration: underline; }

        .follow-btn {
            color: #1877f2;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-left: 4px;
        }

        .post-meta {
            display: flex;
            align-items: center;
            color: #65676b;
            font-size: 13px;
            margin-top: 2px;
            gap: 2px;
        }

        .post-options {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #65676b;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
        }

        /* ── Post text ── */
        .post-content {
            padding: 4px 16px 12px;
            font-size: 15px;
            color: #050505;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* ── Post image ── */
        .post-image {
            width: 100%;
            line-height: 0;
        }

        .post-image img {
            width: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── Engagement row ── */
        .engagement {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #e4e6eb;
            min-height: 36px;
        }

        .reaction-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reaction-icons {
            display: flex;
            gap: 4px;
        }

        .reaction-bubble {
        width: 22px; height: 22px;
        border-radius: 50%;
        border: 2px solid white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        position: relative;
    }

        .reaction-count {
            color: #65676b;
            font-size: 15px;
        }

        .reaction-count:hover {
            text-decoration: underline;
            cursor: pointer;
        }

        .comment-share-counts {
            color: #65676b;
            font-size: 15px;
            cursor: pointer;
        }

        .comment-share-counts:hover { text-decoration: underline; }

        /* ── Action buttons ── */
        .actions {
            display: flex;
            justify-content: space-around;
            padding: 2px 8px;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            color: #65676b;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            gap: 6px;
            user-select: none;
        }

        .action-btn:hover { background-color: #f0f2f5; }

        .action-btn.liked {
            color: #1877f2;
        }

        .action-icon { font-size: 20px; }
    </style>
</head>

<script>
    let liked = false;
    let currentLikes = 100;

    function toggleLike() {
        liked = !liked;
        const btn = document.getElementById('likeBtn');
        const label = document.getElementById('likeBtnLabel');
        const countEl = document.querySelector('.reaction-count');

        if (liked) {
            btn.classList.add('liked');
            label.textContent = 'Liked';
            currentLikes++;
        } else {
            btn.classList.remove('liked');
            label.textContent = 'Like';
            currentLikes--;
        }

        // Update or create the like count display
        if (countEl) {
            countEl.textContent = formatCount(currentLikes);
        } else if (liked) {
            // If there was no like count before, inject the element
            const engLeft = document.querySelector('.engagement > div:first-child');
            engLeft.innerHTML = `
                <div class="reaction-item">
                    <span class="reaction-icons">
                        <span class="reaction-bubble like-bubble">👍</span>
                    </span>
                    <span class="reaction-count">1</span>
                </div>`;
        }
    }

    function formatCount(n) {
        if (n <= 0) return null;
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        return n.toString();
    }

    function focusComment() {
        // Scrolls to bottom to simulate opening comment box
        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    }
</script>
